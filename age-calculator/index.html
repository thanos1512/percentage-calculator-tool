<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Age Calculator - Calculate Your Exact Age</title>
  <meta name="description" content="Free online age calculator to calculate your exact age in years, months, and days instantly." />

  <style>
    body {
      font-family: Arial;
      background: #f2f2f2;
      text-align: center;
      padding: 50px;
    }

    .box {
      background: white;
      padding: 20px;
      max-width: 400px;
      margin: auto;
      border-radius: 10px;
      box-shadow: 0 0 10px #ccc;
    }

    input {
      padding: 10px;
      width: 90%;
      margin: 10px 0;
    }

    button {
      padding: 10px 20px;
      background: green;
      color: white;
      border: none;
      cursor: pointer;
      border-radius: 5px;
    }

    #result {
      margin-top: 15px;
      font-weight: bold;
    }
  </style>
</head>

<body>

  <div class="box">
    <h1>Age Calculator</h1>

    <input type="date" id="dob">

    <br>

    <button onclick="calculateAge()">Calculate Age</button>

    <p id="result"></p>
  </div>

  <script>
    function calculateAge() {
      let dob = document.getElementById("dob").value;

      if (!dob) {
        document.getElementById("result").innerText = "Please select your date of birth";
        return;
      }

      let birthDate = new Date(dob);
      let today = new Date();

      let age = today.getFullYear() - birthDate.getFullYear();
      let m = today.getMonth() - birthDate.getMonth();

      if (m < 0 || (m === 0 && today.getDate() < birthDate.getDate())) {
        age--;
      }

      document.getElementById("result").innerText =
        "Your age is " + age + " years";
    }
  </script>

</body>
</html>
