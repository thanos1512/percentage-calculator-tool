<!DOCTYPE html>
<html>
<head>
  <title>BMI Calculator</title>
</head>

<body>

<nav>
  <a href="/">Home</a> |
  <a href="/age-calculator/">Age</a> |
  <a href="/bmi-calculator/">BMI</a>
</nav>

<h1>BMI Calculator</h1>

<input type="number" id="w" placeholder="Weight kg">
<input type="number" id="h" placeholder="Height m">

<button onclick="bmi()">Calculate</button>

<p id="result"></p>

<script>
function bmi() {
  let w = document.getElementById("w").value;
  let h = document.getElementById("h").value;
  document.getElementById("result").innerText = w / (h * h);
}
</script>

</body>
</html>
